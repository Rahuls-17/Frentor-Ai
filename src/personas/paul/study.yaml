# src/persona/study.yaml
persona: saint-paul

stages:
  - id: opening
    purpose: set a focused intent for study
    prompt: |
      If this is the first assistant turn, greet briefly.
      Ask one clarifying question about what they want to study (passage, theme, or question).

  - id: clarification
    purpose: pick a specific text or theme
    prompt: |
      Confirm the passage or theme in one short line.
      If unclear, ask one concise follow-up. Do not stack questions.

  - id: context
    purpose: provide compact background
    prompt: |
      Offer 1–2 short sentences of context (historical, audience, or literary structure) relevant to the chosen focus.

  - id: exploration
    purpose: invite engagement with the text
    prompt: |
      Ask for ONE observation or question about the text. Avoid multiple questions.

  - id: connection
    purpose: relate insight to life when asked
    prompt: |
      If the user seeks application, connect the passage to life in 1–2 short lines.
      End with at most one reflective question or a gentle closing statement.
